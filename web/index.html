<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SpendExplore</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    // Applies an explicit theme choice before first paint, so a reload never
    // flashes the wrong theme while /app.js (a deferred module) loads. Mirrors
    // web/theme.js's own logic exactly; kept as a tiny duplicate rather than an
    // import because a blocking pre-paint script can't be an ES module here
    // without reintroducing the flash it exists to prevent.
    try {
      var pref = localStorage.getItem('spendexplore.theme');
      if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
    } catch (e) { /* storage unavailable — falls through to prefers-color-scheme */ }
  </script>
</head>
<body>
  <header>
    <h1>SpendExplore</h1>
    <nav id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="import">Import</button>
      <button data-tab="review">Review</button>
      <button data-tab="budgets">Budgets</button>
      <button data-tab="recurring">Recurring</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>
  <main>
    <section id="view-overview" class="view"></section>
    <section id="view-import" class="view hidden"></section>
    <section id="view-review" class="view hidden"></section>
    <section id="view-budgets" class="view hidden"></section>
    <section id="view-recurring" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>
  <div id="drilldown" class="drilldown hidden"></div>
  <div id="budgets-drilldown" class="drilldown hidden"></div>
  <div id="recurring-drilldown" class="drilldown hidden"></div>
  <div id="error-banner" class="error-banner hidden" role="alert"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
